<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="100" height="100" rx="24" fill="#090d16" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#grad1)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Search / Radar Rings -->
  <circle cx="58" cy="42" r="22" stroke="url(#grad1)" stroke-width="4" stroke-opacity="0.25" />
  <circle cx="58" cy="42" r="14" stroke="url(#grad1)" stroke-width="4" stroke-opacity="0.5" />
  <circle cx="58" cy="42" r="6" fill="url(#grad1)" filter="url(#glow)" />

  <!-- Stylized 'R' Path -->
  <path d="M 32 75 L 32 26 C 32 26 56 20 62 36 C 67 48 55 56 46 56 L 32 56 M 46 56 L 68 76" 
        stroke="url(#grad1)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
</svg>
